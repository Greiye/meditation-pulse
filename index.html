<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1416">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Pulse Counter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one centered screen, a breathing disc as the only control, readout and duration chips below. */
:root {
  --bg: #0f1416; --fg: #dfe6e3; --muted: #7d8c88; --accent: #8fc7b1; --disc: #1a2326; --ring: #8fc7b1; --chip: #1a2326;
  --display: "Fraunces", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eef2f0; --fg: #1d2a27; --muted: #5f706b; --accent: #2f7a62; --disc: #dde6e2; --ring: #2f7a62; --chip: #dde6e2; color-scheme: light } }
:root[data-theme="light"] { --bg: #eef2f0; --fg: #1d2a27; --muted: #5f706b; --accent: #2f7a62; --disc: #dde6e2; --ring: #2f7a62; --chip: #dde6e2; color-scheme: light }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--mono);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px; box-sizing: border-box; -webkit-user-select: none; user-select: none;
}
#disc {
  position: relative; width: min(64vw, 280px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: none; background: var(--disc); color: var(--fg); cursor: pointer;
  font-family: var(--display); font-size: clamp(22px, 6vw, 30px); font-weight: 300; letter-spacing: .02em;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#disc:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
#disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ring); opacity: 0; }
#disc.beat::after { animation: ring .9s ease-out; }
#disc svg { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); pointer-events: none; }
#disc svg circle { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
@keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { #disc.beat::after { animation: none; } #disc svg circle { transition: none; } }
#time { font-size: clamp(44px, 14vw, 72px); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 360px; }
.chip {
  font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--chip);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.chip[aria-pressed="true"] { background: var(--chip); color: var(--fg); border-color: var(--accent); }
.chip input { width: 3ch; font: inherit; color: var(--fg); background: transparent; border: none; border-bottom: 1px solid var(--muted); text-align: center; padding: 0; }
body.running .chips { opacity: .35; pointer-events: none; }
#status { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; text-align: center; max-width: 34ch; line-height: 1.6; min-height: 3.2em; }
.opts { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.opts label { display: flex; gap: 8px; align-items: center; }
.opts input { accent-color: var(--accent); }
#ios { position: absolute; left: -9999px; }
</style>

</head>
<body>
<button id="disc" type="button" aria-label="Start">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle id="arc" cx="50" cy="50" r="49" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle></svg>
  <span id="label">Start</span>
</button>
<div id="time" aria-live="off">0:00</div>
<div class="chips" role="group" aria-label="Duration">
  <button class="chip" type="button" data-min="0" aria-pressed="true">Open</button>
  <button class="chip" type="button" data-min="1" aria-pressed="false">1 min</button>
  <button class="chip" type="button" data-min="5" aria-pressed="false">5 min</button>
  <button class="chip" type="button" data-min="10" aria-pressed="false">10 min</button>
  <button class="chip" type="button" data-min="20" aria-pressed="false">20 min</button>
  <span class="chip" data-min="custom" aria-pressed="false"><input id="custom" type="number" inputmode="numeric" min="1" max="180" placeholder="—" aria-label="Custom minutes"> min</span>
</div>
<div class="opts">
  <label><input type="checkbox" id="minute" checked> Long buzz each minute</label>
  <label><input type="checkbox" id="tick"> Soft tick sound</label>
</div>
<div id="status">Pick a duration or Open, then tap the circle.</div>
<label id="ios" aria-hidden="true"><input type="checkbox" switch id="iosSwitch" tabindex="-1"></label>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const disc = $('disc'), label = $('label'), timeEl = $('time'), status = $('status'), arc = $('arc');
  const minuteOpt = $('minute'), tickOpt = $('tick'), iosLabel = $('ios'), custom = $('custom');
  const chips = [...document.querySelectorAll('.chip')];
  const canVibrate = typeof navigator.vibrate === 'function';
  let running = false, t0 = 0, n = 0, total = 0, timer = null, wake = null, ac = null, minutes = 0;

  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { v = null; } return v; };

  function select(chip) {
    chips.forEach(c => c.setAttribute('aria-pressed', c === chip ? 'true' : 'false'));
    const m = chip.dataset.min;
    minutes = m === 'custom' ? Math.max(0, Math.min(180, parseInt(custom.value, 10) || 0)) : +m;
    timeEl.textContent = fmt(minutes * 60);
    store('pulse.min', m === 'custom' ? 'c' + (custom.value || '') : m);
  }
  chips.forEach(c => c.addEventListener('click', e => { if (c.dataset.min === 'custom' && e.target !== custom) custom.focus(); select(c); }));
  custom.addEventListener('input', () => select(chips[chips.length - 1]));
  const saved = store('pulse.min');
  if (saved) {
    if (saved[0] === 'c') { custom.value = saved.slice(1); select(chips[chips.length - 1]); }
    else { const c = chips.find(c => c.dataset.min === saved); if (c) select(c); }
  }

  function haptic(pattern) {
    if (canVibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
    else { const taps = Array.isArray(pattern) ? Math.ceil(pattern.length / 2) : 1; for (let i = 0; i < taps; i++) setTimeout(() => { try { iosLabel.click(); } catch (e) {} }, i * 140); }
  }
  function tone(freq, dur, vol, force) {
    if ((!tickOpt.checked && !force) || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function show() {
    timeEl.textContent = fmt(total ? total - n : n);
    arc.style.strokeDashoffset = total ? 100 - (n / total) * 100 : 100;
  }
  function beat() {
    if (!running) return;
    n++;
    if (total && n >= total) { show(); finish(); return; }
    const long = minuteOpt.checked && n % 60 === 0;
    haptic(long ? [60, 80, 60, 80, 60] : 45);
    tone(long ? 520 : 880, 0.08, 0.12);
    show();
    disc.classList.remove('beat'); void disc.offsetWidth; disc.classList.add('beat');
    timer = setTimeout(beat, Math.max(0, t0 + (n + 1) * 1000 - performance.now()));
  }
  async function start() {
    running = true; n = 0; t0 = performance.now(); total = minutes * 60;
    document.body.classList.add('running');
    label.textContent = 'Stop'; disc.setAttribute('aria-label', 'Stop'); show();
    status.textContent = (total ? 'Counting down ' + fmt(total) + '. ' : 'Counting up. ') + (canVibrate ? 'Pulsing every second.' : 'No vibration in this browser. Turn on the tick sound.');
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) { wake = null; }
    haptic(45);
    timer = setTimeout(beat, 1000);
  }
  function release() {
    running = false; clearTimeout(timer);
    try { wake && wake.release(); } catch (e) {} wake = null;
    document.body.classList.remove('running');
    label.textContent = 'Start'; disc.setAttribute('aria-label', 'Start');
  }
  function stop() {
    release();
    try { navigator.vibrate && navigator.vibrate(0); } catch (e) {}
    status.textContent = 'Stopped at ' + fmt(n) + (total ? ' of ' + fmt(total) : '') + '. Tap to start again.';
  }
  function finish() {
    release();
    haptic([500, 250, 500, 250, 900]);
    // the end chime plays whenever audio is unlocked, even with ticks off
    [0, 0.45, 0.9].forEach(d => setTimeout(() => tone(660, 1.2, 0.18, true), d * 1000));
    status.textContent = "Time's up: " + fmt(total) + '. Tap to go again.';
  }
  disc.addEventListener('click', () => running ? stop() : start());
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  });
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
